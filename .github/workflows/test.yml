name: Test Suite

# Run tests on push to main/master and on pull requests
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          # Set test environment variables
          NODE_ENV: test
          # Add any environment variables your tests need
          # JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          # MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Test build
        run: npm run build
        env:
          NODE_ENV: production
          # Add production build environment variables if needed
          # NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Send email notification on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Test Suite Failed - ${{ github.repository }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            The test suite has failed for repository: ${{ github.repository }}

            **Details:**
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Author: ${{ github.actor }}
            - Node Version: ${{ matrix.node-version }}
            - Workflow: ${{ github.workflow }}
            - Run ID: ${{ github.run_id }}

            **View the failed workflow:**
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Commit Message:**
            ${{ github.event.head_commit.message }}

            Please check the logs and fix the failing tests.
          html_body: |
            <h2>🚨 Test Suite Failed</h2>
            <p>The test suite has failed for repository: <strong>${{ github.repository }}</strong></p>

            <h3>Details:</h3>
            <ul>
              <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
              <li><strong>Commit:</strong> ${{ github.sha }}</li>
              <li><strong>Author:</strong> ${{ github.actor }}</li>
              <li><strong>Node Version:</strong> ${{ matrix.node-version }}</li>
              <li><strong>Workflow:</strong> ${{ github.workflow }}</li>
              <li><strong>Run ID:</strong> ${{ github.run_id }}</li>
            </ul>

            <p><strong>Commit Message:</strong><br>
            ${{ github.event.head_commit.message }}</p>

            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="background-color: #0366d6; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px;">View Failed Workflow</a></p>

            <p>Please check the logs and fix the failing tests.</p>
