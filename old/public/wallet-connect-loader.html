<!DOCTYPE html>
<html>

<head>
    <title>WalletConnect Loader</title>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3modal@2.6.2/dist/index.js"
        integrity="sha384-XJ5/JIo/G4tU8qgUFgxooCPe+8HEVQgFCYWqo5GO6iXGpKB8D09HjZY07rpCCAj"
        crossorigin="anonymous"></script>
    <script>
        // This is just a loader helper to ensure WalletConnect can be loaded
        console.log("WalletConnect Web3Modal loaded:", !!window.WalletConnectModal);
    </script>
</head>

<body>
    <div style="font-family: sans-serif; max-width: 600px; margin: 50px auto; text-align: center;">
        <h1>WalletConnect Test Page</h1>
        <p>This page is just a helper to load and test the WalletConnect script.</p>
        <p>Open your browser console to see if WalletConnect loaded successfully.</p>
        <button id="testButton"
            style="padding: 10px 15px; background: #3396FF; color: white; border: none; border-radius: 8px; cursor: pointer;">
            Test WalletConnect Modal
        </button>

        <script>
            document.getElementById('testButton').addEventListener('click', async () => {
                try {
                    const projectId = "04e0498d619f45278a71f1d15852fe38";

                    if (window.WalletConnectModal) {
                        const web3Modal = new window.WalletConnectModal.Web3Modal({
                            projectId: projectId,
                            chains: [1],
                            themeMode: 'dark'
                        });

                        try {
                            const provider = await web3Modal.openModal();
                            console.log("Selected provider:", provider);
                        } catch (err) {
                            console.error("Modal error:", err);
                        }
                    } else {
                        console.error("WalletConnect not loaded");
                    }
                } catch (err) {
                    console.error("Error testing WalletConnect:", err);
                }
            });
        </script>
    </div>
</body>

</html>
