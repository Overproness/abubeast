name: Dependency Update Check

# Check if tests still pass with updated dependencies
on:
  schedule:
    # Run weekly on Sundays at 6 AM UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  dependency-update-test:
    name: Test with Latest Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Backup package-lock.json
        run: cp package-lock.json package-lock.json.backup

      - name: Update dependencies
        run: |
          # Update all dependencies to latest versions (be careful with this in production)
          npx npm-check-updates -u
          npm install

      - name: Run tests with updated dependencies
        run: npm test
        env:
          NODE_ENV: test

      - name: Run build test with updated dependencies
        run: npm run build
        env:
          NODE_ENV: production
          SKIP_BUILD_STATIC_GENERATION: true

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Dependency Update Test Failed';
            const body = `
            The weekly dependency update test has failed. This could indicate:

            - Breaking changes in updated dependencies
            - Compatibility issues with the current codebase
            - New security vulnerabilities that need attention

            Please review the failed workflow and update dependencies carefully.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            `;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies'
            });

            const existingIssue = issues.data.find(issue => issue.title.includes('Dependency Update Test Failed'));

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['dependencies', 'testing', 'maintenance']
              });
            }
